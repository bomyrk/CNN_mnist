version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000"
    environment:
      - MODEL_PATH=/app/models/on_the_go/fashion_mnist_api_final.keras
    volumes:
      - ./models:/app/models:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - app-network
    restart: unless-stopped

  tensorboard:
    image: tensorflow/tensorflow:latest
    ports:
      - "6006:6006"
    volumes:
      - ./logs:/logs:ro
    command: tensorboard --logdir=/logs --host=0.0.0.0
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
